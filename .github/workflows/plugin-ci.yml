name: plugin-ci

# runs-on parametrizado (UP-07, espelha AM-25 do template): com a variável de
# repositório CI_RUNNER definida, os jobs rodam no runner self-hosted — fallback
# legítimo quando o billing do GitHub Actions corta o cloud. O check continua
# rodando e fica verde DE VERDADE; nunca mais suspender/restaurar branch protection
# para mergear.
#   gh variable set CI_RUNNER --body self-hosted   # migra para o runner próprio
#   gh variable delete CI_RUNNER                   # volta para o cloud

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  frontmatter:
    name: Frontmatter das skills
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # setup-python só no cloud: no runner self-hosted (macOS) o instalador do
      # toolcache exige sudo e caminho /Users/runner — usa-se o python3 da máquina
      - uses: actions/setup-python@v5
        if: ${{ vars.CI_RUNNER == '' }}
        with:
          python-version: "3.12"
      - run: pip install pyyaml
        if: ${{ vars.CI_RUNNER == '' }}
      - run: python3 scripts/ci/check-frontmatter.py

  plugin-paths:
    name: Referências internas do plugin
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ vars.CI_RUNNER == '' }}
        with:
          python-version: "3.12"
      - run: python3 scripts/ci/check-plugin-paths.py

  hooks-smoke:
    name: Smoke dos hooks
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/hooks-smoke.sh

  validate:
    name: claude plugin validate
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validar marketplace e plugin
        run: |
          claude plugin validate .
          claude plugin validate plugin
